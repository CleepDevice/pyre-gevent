# Publish pyre-gevent to PyPI (sdist + wheel).
# Trigger: push a tag vX.Y.Z (must match setup.py version).

name: Publish to PyPI

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        # Required so PYPI_API_TOKEN is loaded (environment secret, not repo secret).
        environment: actions
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python 3.9
              uses: actions/setup-python@v5
              with:
                  python-version: "3.9"

            - name: Check tag matches setup.py version
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  SETUP_VER="$(python -c "import re; print(re.search(r'version=[\"\\']([^\"\\']+)[\"\\']', open('setup.py').read()).group(1))")"
                  echo "tag=$TAG setup.py=$SETUP_VER"
                  test "$TAG" = "$SETUP_VER"

            - name: Install build tools
              run: python -m pip install --upgrade pip build twine

            - name: Build package
              run: |
                  python -m build
                  ls -la dist/

            - name: Publish to PyPI
              env:
                  TWINE_USERNAME: __token__
                  TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
              run: python -m twine upload dist/*
